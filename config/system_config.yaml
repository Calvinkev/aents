system:
  max_iterations: 8
  max_retries_per_subtask: 3
  min_route_score: 0.45
  quality_threshold: 0.75
  optimization_enabled: true
  allow_parallel_candidates: true

routing:
  weights:
    capability: 0.35
    confidence: 0.2
    success_rate: 0.25
    cost: 0.1
    latency: 0.1

failure_policy:
  retry_backoff_seconds: [0.2, 0.5, 1.0]
  use_fallback_specialist: true
  circuit_breaker_failure_threshold: 5
  escalate_on_budget_exhaustion: true

scalability:
  queue_name: "task-dispatch"
  worker_pool_min: 2
  worker_pool_max: 16
  autoscale_target_queue_depth: 25
  enable_trace_sampling: true
