<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AENTS - AI Agent Platform Control Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; color: #c9d1d9; }
        .card-header { background-color: #21262d; border-bottom: 1px solid #30363d; font-weight: 600; }
        .nav-tabs .nav-link { color: #8b949e; border: none; }
        .nav-tabs .nav-link.active { color: #58a6ff; background-color: #161b22; border-bottom: 2px solid #58a6ff; }
        .badge-success { background-color: #238636; }
        .pre-wrap { white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; background-color: #0d1117; padding: 12px; border-radius: 6px; border: 1px solid #30363d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
        <a class="navbar-brand font-monospace fw-bold text-info" href="#">🤖 AENTS Control Center</a>
        <span class="badge bg-success ms-2">LIVE</span>
        <div class="ms-auto text-light small" id="live-status">SSE Connected</div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-secondary small">Total Tasks</div>
                    <div class="fs-2 fw-bold text-light" id="metric-total">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-secondary small">Completed Tasks</div>
                    <div class="fs-2 fw-bold text-success" id="metric-completed">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-secondary small">Success Rate</div>
                    <div class="fs-2 fw-bold text-info" id="metric-rate">100%</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-secondary small">Active Agents</div>
                    <div class="fs-2 fw-bold text-warning" id="metric-agents">8</div>
                </div>
            </div>
        </div>

        <ul class="nav nav-tabs mb-3" id="mainTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-task">New & Active Tasks</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-agents">Specialist Agents</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-events">Live Stream Events</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-task">
                <div class="row g-4">
                    <div class="col-md-5">
                        <div class="card mb-4">
                            <div class="card-header">Dispatch New Task</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">User Task Description</label>
                                    <textarea id="task-input" class="form-control bg-dark text-light border-secondary" rows="4" placeholder="e.g. Analyze repository and identify why authentication returns HTTP 500"></textarea>
                                </div>
                                <button class="btn btn-primary w-100 fw-bold" onclick="submitTask()">Run Task</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
